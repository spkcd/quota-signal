<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quota Signal · Account refresh</title>
  <style>
    :root { color-scheme: dark; font: 15px system-ui; background: #14171b; color: #ebf2f7; }
    body { margin: 10vh auto; max-width: 560px; padding: 24px; }
    h1 { font-size: 25px; }
    p { line-height: 1.6; }
    a, button { color: #59e3f0; font: inherit; }
    button { background: #202830; border: 1px solid #36434c; border-radius: 7px; padding: 9px 14px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    :focus-visible { outline: 2px solid #59e3f0; outline-offset: 4px; }
  </style>
</head>
<body>
  <h1>Refresh your Claude account</h1>
  <p id="target">Checking the account requested by Quota Signal…</p>
  <p id="status" role="status" aria-live="polite">Preparing refresh…</p>
  <p><a href="https://claude.ai/new" target="_blank" rel="noopener">Open Claude in this profile</a></p>
  <button id="retry" disabled>Retry now</button>
  <script type="module" src="command.js"></script>
</body>
</html>
